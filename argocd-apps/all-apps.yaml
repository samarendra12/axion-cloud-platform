apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: axion-ui
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/samarendra12/axion-cloud-platform.git'
    targetRevision: HEAD
    path: 'k8s/axion-ui'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: axion
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
