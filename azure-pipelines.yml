trigger:
  branches:
    include:
      - main
  paths:
    include:
      - axion-ui/**
      - axion-data-simulator/**
      - axion-ingestion-service/**
      - axion-database-schema/**
      - azure-pipelines.yml

pool:
  vmImage: 'ubuntu-latest'

variables:
  # ⚠️ ADO Service Connection ka naam jo aap Project Settings -> Service connections me banayenge
  dockerRegistryServiceConnection: 'acr-service-connection'
  # ⚠️ Aapka Azure Container Registry login server
  containerRegistry: 'samaridhi1234.azurecr.io'
  tag: '$(Build.BuildId)'

stages:
  # ==========================================================
  # STAGE 1: Build & Push Docker Images to ACR
  # ==========================================================
  - stage: BuildAndPush
    displayName: 'Build & Push Axion Microservices'
    jobs:
      - job: BuildApps
        displayName: 'Matrix Build for Axion Apps'
        strategy:
          matrix:
            AxionUI:
              appName: 'axion-ui'
              dockerfilePath: 'axion-ui/Dockerfile'
              buildContext: 'axion-ui'
            AxionDataSimulator:
              appName: 'axion-data-simulator'
              dockerfilePath: 'axion-data-simulator/Dockerfile'
              buildContext: 'axion-data-simulator'
            AxionIngestionService:
              appName: 'axion-ingestion-service'
              dockerfilePath: 'axion-ingestion-service/Dockerfile'
              buildContext: 'axion-ingestion-service'
            AxionDatabaseSchema:
              appName: 'axion-database-schema'
              dockerfilePath: 'axion-database-schema/Dockerfile'
              buildContext: 'axion-database-schema'
        steps:
          - task: Docker@2
            displayName: 'Docker Build & Push $(appName)'
            inputs:
              command: 'buildAndPush'
              repository: '$(appName)'
              dockerfile: '$(dockerfilePath)'
              buildContext: '$(buildContext)'
              containerRegistry: '$(dockerRegistryServiceConnection)'
              tags: |
                $(tag)
                latest

  # ==========================================================
  # STAGE 2: Update Kubernetes Manifests with New Tag
  # ==========================================================
  - stage: UpdateManifests
    displayName: 'Update K8s GitOps Manifests'
    dependsOn: BuildAndPush
    condition: succeeded()
    jobs:
      - job: UpdateGitOps
        displayName: 'Commit New Image Tags to Git'
        steps:
          - checkout: self
            persistCredentials: true

          - bash: |
              set -e
              echo "===> Updating image tags in k8s manifests to tag: $(tag)"
              
              # Manifests me naye image tags replace karein
              sed -i "s|image: $(containerRegistry)/axion-ui:.*|image: $(containerRegistry)/axion-ui:$(tag)|g" k8s/axion-ui/deployment.yaml || true
              sed -i "s|image: $(containerRegistry)/axion-data-simulator:.*|image: $(containerRegistry)/axion-data-simulator:$(tag)|g" k8s/axion-data-simulator/deployment.yaml || true
              sed -i "s|image: $(containerRegistry)/axion-ingestion-service:.*|image: $(containerRegistry)/axion-ingestion-service:$(tag)|g" k8s/axion-ingestion-service/deployment.yaml || true
              sed -i "s|image: $(containerRegistry)/axion-database-schema:.*|image: $(containerRegistry)/axion-database-schema:$(tag)|g" k8s/axion-database-schema/deployment.yaml || true

              git config --global user.email "azure-pipelines[bot]@devops.azure.com"
              git config --global user.name "Azure Pipelines Automation"

              git add k8s/
              if git diff-index --quiet HEAD; then
                echo "No changes in manifests to commit."
              else
                # [skip ci] lagana bahut zaroori hai taaki yeh commit pipeline ko dobara trigger na kare
                git commit -m "chore(gitops): update axion images to $(tag) [skip ci]"
                git push origin HEAD:main
                echo "===> Updated manifests pushed to Git successfully."
              fi
            displayName: 'Update and Push Manifests'
