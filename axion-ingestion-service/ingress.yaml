apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: axion-ingestion-ingress
spec:
  ingressClassName: azure-application-gateway
  rules:
    - host: ingestion.samarendra.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ingestion-service
                port:
                  number: 9000