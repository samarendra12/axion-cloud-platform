apiVersion: apps/v1
kind: Deployment
metadata:
  name: axion-ingestion-service
  namespace: axion
  labels:
    app: axion-ingestion-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: axion-ingestion-service
  template:
    metadata:
      labels:
        app: axion-ingestion-service
    spec:
      containers:
        - name: axion-ingestion-service
          image: samaridhi1234.azurecr.io/axion-ingestion-service:latest
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: axion-ingestion-service
  namespace: axion
spec:
  type: ClusterIP
  selector:
    app: axion-ingestion-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
